<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mente en Control · Una WebQuest sobre cómo la tecnología influye en nuestra forma de pensar</title>
<meta name="description" content="Mind in Control: a Digital Thinking Identity WebQuest / Mente en Control: una WebQuest sobre cómo la tecnología influye en nuestra forma de pensar">
<meta name="author" content="Charles Niño, Juan José Betancour, Santiago Castrillón">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Mind in Control brand palette - clean, light, professional (same brand
     hex values as the brand SVG assets; only the light/dark assignment changed) */
  --navy:#0F2D4A; --teal:#14B8A6; --azure:#3B82F6; --mint:#A7E3D8; --lightgray:#F4F7FA; --charcoal:#334155;
  --bg:#F3F6F9; --panel:#FFFFFF; --panel2:#EEF3F7; --line:#DCE4EC;
  --text:#101B2A; --muted:#5B6B80; --accent:var(--teal); --accent2:var(--azure);
  --ok:#0E9F6E; --warn:#B45309; --lock:#C22B3F; --focus:#2563EB;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.6 "Inter",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.brand b{font-family:"Montserrat","Inter",system-ui,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:0 18px 64px}
.shell{display:flex;flex-direction:column;max-width:1180px;margin:0 auto}
.sidenav{width:100%}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 24px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:50;flex-wrap:wrap;
  box-shadow:0 1px 2px rgba(16,24,40,.05);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{
  width:42px;height:42px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:19px;padding:7px;
  box-shadow:0 6px 16px -6px rgba(20,184,166,.4);
}
.mark img{width:100%;height:100%;object-fit:contain}
.ichip{
  display:inline-grid;place-items:center;vertical-align:middle;flex:none;
  width:26px;height:26px;border-radius:8px;background:var(--mint);margin-right:7px;
}
.ichip img{width:68%;height:68%;object-fit:contain;display:block}
.tab .ti .ichip{margin-right:0;background:transparent;width:60%;height:60%}
.brand b{display:block;font-size:15.5px;letter-spacing:.2px;line-height:1.25;font-weight:700;color:var(--navy)}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.langbtn{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:999px;padding:7px 14px;font:600 12.5px/1 inherit;cursor:pointer;
  display:flex;align-items:center;gap:7px;flex:none;transition:.2s;
}
.langbtn:hover{border-color:var(--accent)}

/* ---------- section stepper (same headings, same order as the WebQuest document) ---------- */
.tabs{
  display:flex;gap:0;padding:22px 4px 8px;margin:0 0 4px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;flex:1 1 0;min-width:78px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:none;border:none;color:var(--muted);
  font-size:11px;font-weight:600;line-height:1.2;letter-spacing:.2px;
  padding:0 3px 4px;transition:.2s;
}
.tab::before{
  content:"";position:absolute;top:26px;left:calc(-50% + 26px);width:calc(100% - 52px);height:2px;
  background:var(--line);z-index:1;transition:.3s;
}
.tab:first-child::before{display:none}
.tab.done::before{background:var(--ok)}
.tab .ti{
  width:52px;height:52px;border-radius:50%;flex:none;position:relative;z-index:2;
  display:grid;place-items:center;font-size:21px;color:var(--navy);
  background:var(--mint);border:2px solid var(--line);transition:.2s;
  box-shadow:0 1px 2px rgba(16,24,40,.06);
}
.tab .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab:hover:not(:disabled){color:var(--text)}
.tab:hover:not(:disabled) .ti{border-color:var(--accent2);transform:translateY(-1px)}
.tab.done{color:var(--ok)}
.tab.done .ti{border-color:var(--ok);background:var(--ok);color:#fff}
.tab.now{color:var(--accent)}
.tab.now .ti{border-color:var(--accent);box-shadow:0 0 0 5px rgba(20,184,166,.16)}
.tab:disabled{opacity:.42;cursor:not-allowed}
[hidden]{display:none!important}
.bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:12px 0 22px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease}
.stepcount{font-size:11.5px;color:var(--muted);text-align:right;margin:-16px 0 20px}

/* ---------- desktop: sticky sidebar with a vertical stepper ---------- */
@media(min-width:900px){
  .shell{flex-direction:row;align-items:flex-start;gap:30px;padding:0 24px}
  .sidenav{
    width:236px;flex:none;position:sticky;top:80px;
    padding:28px 0 28px 2px;
  }
  .wrap{max-width:800px;margin:0 auto;padding:28px 0 64px}
  .sidenav{border-right:1px solid var(--line)}
  .tabs{flex-direction:column;padding:0 20px 20px 0;margin:0;overflow:visible}
  .tab{
    flex-direction:row;justify-content:flex-start;gap:14px;min-height:68px;
    padding:8px 10px;border-radius:12px;text-align:left;
  }
  .tab:hover:not(:disabled){background:var(--panel2)}
  .tab.now{background:var(--panel2)}
  .tab .tl{white-space:normal;font-size:13px}
  .tab::before{top:-34px;left:36px;width:2px;height:68px}
  .bar{margin:0 20px 8px 0}
  .stepcount{text-align:left;margin:0 20px 0 0}
}

/* ---------- page content (no outer card — content flows on the page,
   real card treatment is reserved for genuinely discrete items like
   .choice/.idcard/.team/.rule below) ---------- */
.panel{animation:in .35s ease;padding:6px 0 0}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .panel{animation:none}
  *{transition:none!important}
}
h1{font-size:36px;line-height:1.18;margin:0 0 10px;letter-spacing:-.6px;color:var(--navy)}
h2{font-size:25px;margin:0 0 14px;letter-spacing:-.3px;color:var(--navy)}
h3{font-size:14px;margin:30px 0 12px;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;font-weight:800}
.sub{color:var(--accent2);font-size:14px;font-weight:600;margin:0 0 18px;letter-spacing:.5px}
.hint{color:var(--muted);font-size:14px;margin:0 0 18px}
p{margin:0 0 16px}
.lead{font-size:17px;line-height:1.75}

/* ---------- hero (Introduction page): a soft tinted band, not a card ---------- */
.panel.hero{
  padding:30px 32px 36px;margin:0 0 8px;border-radius:20px;
  background:
    radial-gradient(circle at 18% -15%,rgba(20,184,166,.12),transparent 52%),
    radial-gradient(circle at 105% 115%,rgba(59,130,246,.1),transparent 52%),
    var(--panel2);
}
.herotop{text-align:center;margin:0 0 30px}
.herologo{
  width:66px;height:66px;margin:0 auto 18px;border-radius:18px;padding:13px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;box-shadow:0 12px 28px -12px rgba(20,184,166,.4);
}
.herologo img{width:100%;height:100%;object-fit:contain}
.herotop h1{font-size:33px;color:var(--navy)}
.herotop .sub{
  display:inline-block;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);
  color:var(--accent2);padding:5px 16px;border-radius:999px;font-size:11.5px;margin:0 0 18px;
}
.herotop .heroq{font-size:19px;line-height:1.6;max-width:580px;margin:0 auto;color:var(--text)}

.eq{
  border-left:3px solid var(--accent);background:var(--panel2);
  padding:18px 20px;border-radius:0 var(--r) var(--r) 0;margin:0 0 22px;
  font-size:18px;font-weight:600;line-height:1.5;
}
.callout{
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;margin:0 0 18px;font-size:14.5px;
}
.callout.warn{border-color:var(--warn);background:rgba(180,83,9,.08)}
.callout.lock{border-color:var(--lock);background:rgba(194,43,63,.07)}
.callout.open{border-color:var(--ok);background:rgba(14,159,110,.08)}
.callout b{color:var(--text)}

/* ---------- forms ---------- */
label{display:block;margin:0 0 16px;font-size:14px;font-weight:600}
label .q{display:block;margin-bottom:7px;line-height:1.5}
label .tip{display:block;font-weight:400;color:var(--muted);font-size:13px;margin:3px 0 7px;line-height:1.5}
input[type=text],textarea,select{
  width:100%;padding:11px 13px;background:var(--panel2);color:var(--text);
  border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;
  font-weight:400;resize:vertical;
}
textarea{min-height:88px;line-height:1.6}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,[role=radio]:focus-visible{
  outline:3px solid var(--focus);outline-offset:2px;
}
input::placeholder,textarea::placeholder{color:var(--muted)}

/* ---------- cards / choices ---------- */
.cards{display:grid;gap:12px;margin:0 0 20px}
@media(min-width:700px){.cards.three{grid-template-columns:repeat(3,1fr)}}
.choice{
  background:var(--panel2);border:2px solid var(--line);border-radius:var(--r);
  padding:17px;cursor:pointer;text-align:left;font:inherit;color:var(--text);
  display:flex;flex-direction:column;gap:8px;transition:.2s;width:100%;
}
.choice:hover{border-color:var(--accent2);transform:translateY(-2px)}
.choice[aria-checked=true]{border-color:var(--accent);background:rgba(20,184,166,.08)}
.choice .k{font-weight:800;font-size:12.5px;letter-spacing:1.1px;color:var(--accent2);display:flex;align-items:center;gap:7px}
.choice[aria-checked=true] .k{color:var(--accent)}
.choice .k .tick{
  width:17px;height:17px;border-radius:50%;border:2px solid currentColor;flex:none;
  display:grid;place-items:center;font-size:10px;
}
.choice[aria-checked=true] .k .tick{background:var(--accent);border-color:var(--accent);color:#06202a}
.choice .d{font-size:14px;font-weight:400;line-height:1.55;color:var(--text)}
.choice.tile{cursor:default}
.choice.tile:hover{border-color:var(--line);transform:none}

.checklist{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:8px}
@media(min-width:640px){.checklist{grid-template-columns:1fr 1fr}}
.checklist li{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;font-size:14.5px;line-height:1.5;display:flex;gap:10px;
}
.checklist li::before{content:"✓";color:var(--ok);font-weight:800;flex:none}

.reflist{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.reflist li{
  background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;padding:14px 16px;
}
.reflist .rt{font-weight:700;font-size:15px;line-height:1.45;margin-bottom:6px}
.reflist a{color:var(--accent);font-size:13px;line-height:1.5;word-break:break-all}
.reflist a:hover{color:var(--text)}
.pre{white-space:pre-wrap}

.factlist{display:grid;gap:9px;margin:0 0 18px}
@media(min-width:640px){.factlist{grid-template-columns:1fr 1fr}}
.fact{
  background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent2);
  border-radius:9px;padding:12px 14px;font-size:14px;line-height:1.5;display:flex;gap:10px;
}
.fact b{color:var(--accent2);flex:none}

.timer{
  font:800 44px/1 "Segoe UI",system-ui,sans-serif;text-align:center;
  color:var(--accent);letter-spacing:2px;margin:6px 0 4px;font-variant-numeric:tabular-nums;
}
.timer.low{color:var(--lock)}
.timerlabel{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 18px;letter-spacing:.6px}

.roster{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:9px}
.roster li{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;font-size:14.5px;line-height:1.55;
}
.roster li b{color:var(--accent)}

/* ---------- results ---------- */
.badge{text-align:center;padding:8px 0 4px}
.badge .icon{font-size:66px;line-height:1;display:block;margin-bottom:6px}
.badge .name{font-size:25px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.badge .score{
  display:inline-block;background:var(--panel2);border:1px solid var(--accent);
  color:var(--accent);border-radius:999px;padding:6px 18px;font-weight:700;font-size:14px;
}
.meter{margin:0 0 13px}
.meter .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px;gap:10px}
.meter .top b{color:var(--muted);font-weight:600}
.meter .track{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden}
.meter .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* ---------- identity card ---------- */
.idcard{
  background:linear-gradient(150deg,var(--panel2),#ffffff);
  border:1px solid var(--accent);border-radius:var(--r);padding:22px;margin:0 0 20px;
  box-shadow:0 1px 2px rgba(16,24,40,.05);
}
.idcard .cap{font-size:11px;letter-spacing:1.6px;color:var(--accent);font-weight:700;margin-bottom:3px}
.rule{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:14px;margin:0 0 11px;transition:.2s;
}
.rule:hover{border-color:var(--accent2);transform:translateX(2px)}
.rule .n{font-weight:800;color:var(--accent2);font-size:13px;letter-spacing:.6px;margin-bottom:7px;display:flex;align-items:center}
.rule p{margin:0;font-size:14.5px}

/* ---------- buttons ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
button{font:inherit;cursor:pointer}
.btn{
  background:#fff;border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:12px 20px;font-weight:600;font-size:15px;transition:.2s;
  box-shadow:0 1px 2px rgba(16,24,40,.04);
}
.btn:hover{border-color:var(--navy);transform:translateY(-1px);box-shadow:0 4px 10px -2px rgba(16,24,40,.12)}
.btn.primary{
  background:var(--navy);border:1px solid var(--navy);color:#fff;font-weight:700;
}
.btn.primary:hover{background:#0a2440;border-color:#0a2440;box-shadow:0 6px 16px -4px rgba(15,45,74,.4)}
.btn.big{padding:16px 30px;font-size:17px;border-radius:12px}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--panel2);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;filter:none;box-shadow:none}
.btn.danger:hover{border-color:var(--lock);color:var(--lock)}
.spacer{flex:1}
.gate{
  color:var(--warn);font-size:13.5px;margin-top:12px;display:flex;gap:8px;align-items:flex-start;
}
.mantra{
  text-align:center;font-weight:800;letter-spacing:1px;font-size:15px;line-height:1.9;
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;margin:22px 0 16px;color:var(--accent);
}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:22px 0 0}
.credits{
  max-width:640px;margin:18px auto 0;padding:14px 0 0;border-top:1px solid var(--line);
  text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;
}
.credits .cap{font-size:10.5px;letter-spacing:1.6px;font-weight:700;color:var(--accent);text-transform:uppercase;margin:0 0 6px}
.credits dl{margin:0}
.credits dt{display:inline;font-weight:700;color:var(--text)}
.credits dd{display:inline;margin:0 0 0 4px}

/* ---------- meet the team ---------- */
.teamgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:0 0 20px}
.teammate{
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);
}
.avatar{
  width:48px;height:48px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;letter-spacing:.3px;
}
.teammate b{font-size:14.5px;font-weight:700;line-height:1.3;color:var(--navy)}
.teambio{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
.teammeta{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media print{
  body{background:#fff;color:#000}
  header,.tabs,.bar,.stepcount,.actions,.foot,nav{display:none!important}
  .panel,.idcard,.rule{border-color:#999;background:#fff;color:#000;box-shadow:none}
  .panel.hero{background:#fff}
  .panel::before{display:none}
  .herologo{box-shadow:none}
  .herotop .sub{background:none;border-color:#999;color:#000}
  .idcard .cap,.rule .n{color:#000}
  h1,h2,h3{color:#000}
  .credits{color:#333;border-color:#999}
  .credits dt,.credits .cap{color:#000}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark" aria-hidden="true"><img src="assets/brand/logo-icon.svg" alt="" width="42" height="42"></div>
    <div>
      <b id="brandTitle">Mind in Control</b>
      <span id="brandSub">A Digital Thinking Identity WebQuest</span>
    </div>
  </div>
  <button class="langbtn" id="langBtn" type="button"><span>🌐</span><span id="langLabel">English</span></button>
</header>

<div class="shell">
  <div class="sidenav">
    <nav class="tabs" id="tabs" aria-label="WebQuest sections"></nav>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div class="stepcount" id="stepCount"></div>
  </div>
  <div class="wrap">
    <main id="screen" tabindex="-1"></main>
    <p class="foot" id="foot"></p>
    <footer class="credits" id="credits"></footer>
  </div>
</div>

<script>
"use strict";

/* =========================================================================
   1. CONFIG
   ========================================================================= */
var QS = new URLSearchParams(location.search);
var TIMER_SECONDS = Math.max(5, parseInt(QS.get("t"), 10) || 90);
var KEY = "dml.v2";

/* =========================================================================
   2. STORAGE — never throws. Wix Editor/Preview blocks localStorage.
   ========================================================================= */
var store = (function () {
  var mem = {}, ok = true;
  try { localStorage.setItem("__dml", "1"); localStorage.removeItem("__dml"); }
  catch (e) { ok = false; }
  return {
    available: ok,
    get: function (k) { try { return ok ? localStorage.getItem(k) : mem[k]; } catch (e) { return mem[k]; } },
    set: function (k, v) { try { ok ? localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { mem[k] = v; } },
    del: function (k) { try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch (e) { delete mem[k]; } }
  };
})();

/* =========================================================================
   3. STATE
   ========================================================================= */
function blank() {
  return {
    lang: "es", step: 0,
    cp1: { pasted: "", correct: "", trust: "", source: "", reflect: "" },
    cp2: { started: false, revealed: false, showFacts: false, recall: "", reflect: "" },
    cp3: { round: 1, first: "", ai: "", improved: "", compare: "", reflect: "" },
    self: { cp1: null, cp2: null, cp3: null },
    /* AI grading run against the actual checkpoint answers (see §7 EVALUATE).
       status: "idle" | "loading" | "done" | "error" | "manual".
       sig is a snapshot of the answers the current result/attempt was run against,
       so editing an earlier checkpoint and coming back automatically re-grades. */
    selfEval: { status: "idle", sig: "", result: null, error: "" },
    card: { name: "", skill: "", helps: "", replaces: "", r1: "", r2: "", r3: "" },
    fin: { learned: "", changed: "" }
  };
}
var S = blank();
(function load() {
  /* dml.v1 saved answers for the old page order; they no longer map onto these pages. */
  store.del("dml.v1");
  try {
    var raw = store.get(KEY);
    if (raw) {
      var p = JSON.parse(raw), b = blank();
      for (var k in b) if (p[k] !== undefined) {
        b[k] = (typeof b[k] === "object" && b[k] !== null && !Array.isArray(b[k]))
          ? Object.assign(b[k], p[k]) : p[k];
      }
      S = b;
      S.cp2.started = false; S.cp2.revealed = S.cp2.recall ? true : false;
    }

/* =========================================================================

   api/src/shared/sufficiency.js (isLowEffort / checkSufficiency) so a
   checkpoint page can flag a thin, blank, or low-effort answer the moment
   it's typed, instead of only finding out from the AI grader at the end.
   This is a preview only; the server pre-check is still the one that
   actually decides needsReview. Keep the rules in sync with that file.
   ========================================================================= */
function wcLive(text) { return String(text || "").trim().split(/\s+/).filter(Boolean).length; }
function lowEffortLive(text) {
  var s = String(text || "").trim();
  if (!s) return true;
  if (/^(.)\1{3,}$/i.test(s.replace(/\s+/g, ""))) return true;
  var words = s.toLowerCase().split(/\s+/).filter(Boolean).map(function (w) { return w.replace(/[,.!?;:]+$/g, ""); });
  if (words.length === 0) return true;
  var uniq = {}, i;
  for (i = 0; i < words.length; i++) uniq[words[i]] = true;
  var uniqueRatio = Object.keys(uniq).length / words.length;
  if (words.length >= 2 && uniqueRatio < 0.5) return true;
  return false;
}
function duplicateFieldsLive(values) {
  var seen = {}, i, key;
  for (i = 0; i < values.length; i++) {
    key = String(values[i] || "").trim().toLowerCase();
    if (!key) continue;
    seen[key] = (seen[key] || 0) + 1;
    if (seen[key] >= 2 && wcLive(key) <= 8) return true;
  }
  return false;
}

function cpLiveInsufficient(n) {

  var cp = n === 1 ? S.cp1 : S.cp3, keys = CP_SUFF_FIELDS[n], values = [], i, wc = 0;
  for (i = 0; i < keys.length; i++) { values.push(cp[keys[i]] || ""); }
  for (i = 0; i < values.length; i++) wc += wcLive(values[i]);
  if (wc === 0) return null; /* nothing typed yet — stay quiet */
  var answered = 0;
  for (i = 0; i < values.length; i++) { if (wcLive(values[i]) >= 3 && !lowEffortLive(values[i])) answered++; }
  return answered === 0 || wc < 15 || duplicateFieldsLive(values);
}

/* =========================================================================
   8. GATES — what each page needs before the WebQuest moves on
   ========================================================================= */
function gateAt(i) {
  var L = t();
  switch (STEPS[i]) {
    case "cp1": return has("cp1.pasted") ? null : L.gateFirst;
    case "cp1r": return has("cp1.reflect") ? null : L.gateText;
    case "cp2": return S.cp2.showFacts && has("cp2.recall") ? null : L.gateMem;
    case "cp2r": return has("cp2.reflect") ? null : L.gateText;
    case "cp3": return has("cp3.first") && has("cp3.improved") && has("cp3.compare") ? null : L.gateSolve;
    case "cp3r": return has("cp3.reflect") ? null : L.gateText;
    case "selfeval": return S.self.cp1 && S.self.cp2 && S.self.cp3 ? null : L.gateChoice;
    case "card": return has("card.skill") && has("card.helps") && has("card.replaces") ? null : L.gateCard;
    case "final": return has("fin.learned") && has("fin.changed") ? null : L.gateText;
  }
  return null;
}
function gate() { return gateAt(S.step); }
/* A page can be entered if it is a reading page, or if every page before it is complete. */
function canEnter(i) {
  if (FREE[STEPS[i]]) return true;
  for (var j = 0; j < i; j++) if (gateAt(j)) return false;
  return true;
}
/* From a reading page opened out of order, "Previous" returns to where the person left off. */
function prevStep() {
  for (var j = S.step - 1; j >= 0; j--) if (canEnter(j)) return j;
  return -1;
}
/* Only Process and Result contain activities, so only they can be marked complete. */
function sectionDone(sec) {
  if (sec !== SECTION_OF[STEPS.indexOf("cp1")] && sec !== SECTION_OF[STEPS.indexOf("selfeval")]) return false;
  for (var j = 0; j < STEPS.length; j++) if (SECTION_OF[j] === sec && gateAt(j)) return false;
  return true;
}

/* =========================================================================
   9. RENDER
   ========================================================================= */
var lastTabs = "";
function renderTabs(L) {
  var nav = $("tabs"), cur = SECTION_OF[S.step], h = "";
  for (var i = 0; i < SECTION_FIRST.length; i++) {
    var open = canEnter(SECTION_FIRST[i]), done = sectionDone(i), now = i === cur;
    h += '<button type="button" class="tab' + (now ? " now" : "") + (done ? " done" : "") + '"' +
      ' data-go="' + SECTION_FIRST[i] + '"' + (now ? ' aria-current="page"' : "") +
      (open ? "" : ' disabled title="' + esc(L.locked) + '"') + ">" +
      '<span class="ti" aria-hidden="true">' + (done ? "✓" : open ? SECTION_ICON[i] : "🔒") + "</span>" +
      '<span class="tl">' + esc(L.sections[i]) + "</span></button>";
  }
  nav.setAttribute("aria-label", L.navLabel);
  /* Called on every keystroke; only touch the DOM when something actually changed. */
  if (h !== lastTabs) { nav.innerHTML = h; lastTabs = h; }
}

function renderCredits(L) {
  var h = '<p class="cap">' + esc(L.credTitle) + "</p><dl>";
  for (var i = 0; i < L.cred.length; i++) {
    h += "<div><dt>" + esc(L.cred[i][0]) + ":</dt><dd>" + esc(L.cred[i][1]) + "</dd></div>";
  }
  $("credits").innerHTML = h + "</dl>";
}

function render() {
  var L = t();
  document.documentElement.lang = L.htmlLang;
  document.title = L.brand + " · " + L.brandSub;
  $("brandTitle").textContent = L.brand;
  $("brandSub").textContent = L.brandSub;
  $("langLabel").textContent = L.other;
  $("foot").textContent = L.foot;
  renderCredits(L);
  renderTabs(L);
  $("barFill").style.width = (S.step / (STEPS.length - 1) * 100) + "%";
  $("stepCount").textContent = L.step.replace("%1", S.step + 1).replace("%2", STEPS.length);

  /* screen */
  if (!(STEPS[S.step] === "cp2" && S.cp2.started)) stopTimer();
  if (STEPS[S.step] === "selfeval" && needsEval() && S.selfEval.status !== "loading") {
    runEvaluate(); // sets status to "loading" and re-renders; this pass's body is stale, skip it.
    return;
  }
  var body = V[STEPS[S.step]]();

  /* nav */
  var g = gate(), back = prevStep(), navH = '<div class="actions">';
  if (back >= 0) navH += '<button class="btn" data-go="' + back + '">' + esc(L.prev) + "</button>";
  navH += '<span class="spacer"></span>';
  if (S.step < STEPS.length - 1) {
    navH += '<button class="btn primary" id="nextBtn"' + (g ? " disabled" : "") + ">" + esc(L.next) + "</button>";
  }
  navH += "</div>" +
    '<p class="gate" id="gateMsg" role="status"' + (g ? ">⚠ " + esc(g) : " hidden>") + "</p>";
  if (S.step > 0) {
    navH += '<div class="actions"><button class="btn ghost danger" id="restartBtn" style="font-size:13px;padding:8px 14px">' + esc(L.restart) + "</button></div>";
  }
  if (!store.available && S.step === 0) {
    body += '<div class="callout warn" style="margin-top:16px">⚠ ' + esc(L.noStore) + "</div>";
  }

  $("screen").innerHTML = body + navH;
  refreshLiveFlag();
  postHeight();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function go(n) {
  n = Math.max(0, Math.min(STEPS.length - 1, n));
  if (!canEnter(n)) return;
  /* Leaving during the memory countdown cancels it; the challenge can be started again. */
  if (S.cp2.started && n !== S.step) { stopTimer(); S.cp2.started = false; }
  S.step = n;
  save(); render();
}

/* =========================================================================
   10. WIRING — bound once to the stable containers, never per render,
   otherwise listeners accumulate and every click fires N times.
   ========================================================================= */
function wire() {
  var sc = $("screen");

  sc.addEventListener("input", function (e) {
    var k = e.target.getAttribute("data-k");
    if (!k) return;
    set(k, e.target.value); save(); refresh();
  });
  sc.addEventListener("change", function (e) {
    var k = e.target.getAttribute("data-k");
    if (k && e.target.tagName === "SELECT") { set(k, e.target.value); save(); refresh(); }
  });

  sc.addEventListener("click", function (e) {
    var el = e.target.closest("[data-go]");
    if (el) { go(Number(el.getAttribute("data-go"))); return; }

    var ch = e.target.closest("[data-choice]");
    if (ch) { pick(ch); return; }

    var b = e.target.closest("button"), id = b ? b.id : "";
    if (id === "nextBtn") { go(S.step + 1); return; }
    if (id === "startMem") { startMemory(); return; }
    if (id === "revealFacts") { S.cp2.showFacts = true; save(); render(); return; }
    if (id === "toR2") { S.cp3.round = 2; save(); render(); return; }
    if (id === "backR1") { S.cp3.round = 1; save(); render(); return; }
    if (id === "printBtn" || id === "printBtn2") { window.print(); return; }
    if (id === "copyBtn" || id === "copyBtn2") { copyTranscript(); return; }
    if (id === "retryEval") { runEvaluate(); return; }
    if (id === "manualEval") { useManualEval(); return; }
    if (id === "backToAI") { S.selfEval.sig = ""; save(); runEvaluate(); return; }
    if (id === "restartBtn") {
      if (confirm(t().restartAsk)) { store.del(KEY); S = blank(); save(); render(); }
      return;
    }
  });

  sc.addEventListener("keydown", function (e) {
    var ch = e.target.closest("[role=radio]");
    if (ch && (e.key === " " || e.key === "Enter")) { e.preventDefault(); ch.click(); }
  });

  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-go]");
    if (b && !b.disabled) go(Number(b.getAttribute("data-go")));
  });
}

/* Self-evaluation answers update in place, so choosing one does not jump the page back to the top. */
function pick(btn) {
  set(btn.getAttribute("data-choice"), Number(btn.getAttribute("data-pts"))); save();
  var all = btn.parentNode.querySelectorAll("[data-choice]");
  for (var i = 0; i < all.length; i++) {
    var on = all[i] === btn;
    all[i].setAttribute("aria-checked", on ? "true" : "false");
    all[i].querySelector(".tick").textContent = on ? "✓" : "";
  }
  refresh();
}

/* Re-check the gates after typing or choosing, without re-rendering (keeps focus and scroll position). */
function refresh() {
  var g = gate(), b = $("nextBtn"), m = $("gateMsg");
  if (b) b.disabled = !!g;
  if (m) { m.hidden = !g; m.textContent = g ? "⚠ " + g : ""; }
  var need = $("screen").querySelectorAll("[data-needs]");
  for (var i = 0; i < need.length; i++) need[i].disabled = !has(need[i].getAttribute("data-needs"));
  renderTabs(t());
  refreshLiveFlag();
  postHeight();
}

/* memory timer — counts down to a fixed deadline, so a re-render (e.g. switching language) does not stop it */
var timerId = null, memEnd = 0, lastSaid = -1;
function secondsLeft() { return Math.max(0, Math.ceil((memEnd - Date.now()) / 1000)); }
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function startMemory() {
  memEnd = Date.now() + TIMER_SECONDS * 1000; lastSaid = -1;
  S.cp2.started = true; S.cp2.showFacts = false;
  render();
  stopTimer(); timerId = setInterval(tick, 250);
}
function tick() {
  var left = secondsLeft(), clock = $("clock"), sr = $("timerSR");
  if (clock) {
    clock.textContent = left;
    if (left <= 10) clock.classList.add("low");
  }
  if (sr && left !== lastSaid && (left === 30 || left === 10 || left === 5)) { sr.textContent = left + ""; lastSaid = left; }
  if (left <= 0) {
    stopTimer();
    S.cp2.started = false; S.cp2.revealed = true; save(); render();
  }
}

/* transcript */
function buildTranscript() {
  var L = t(), T = L.tr, n = total(), id = L.ids[band(n)], sc = scores(), i;
  var B = T.blank, nl = "\n", rule = "-".repeat(40) + nl;
  function line(k, v) { return k + (/[?:]$/.test(k) ? " " : ": ") + (String(v || "").trim() || B) + nl; }
  var o = T.head + nl + "=".repeat(56) + nl + nl;
  o += line(T.name, S.card.name);
  o += line(T.identity, id[0] + " " + id[1]);
  o += line(T.total, n + " / 9") + nl;

  o += T.s1 + nl + rule;
  o += line(T.first, S.cp1.pasted);
  for (i = 0; i < L.c1Checks.length; i++) o += line(L.c1Checks[i][0], S.cp1[CP1_KEYS[i]]);
  o += line(T.reflect, S.cp1.reflect) + nl;

  o += T.s2 + nl + rule;
  o += line(T.recall, S.cp2.recall);
  o += line(T.reflect, S.cp2.reflect) + nl;

  o += T.s3 + nl + rule;
  o += line(L.c3First, S.cp3.first);
  o += line(T.ai, S.cp3.ai);
  o += line(L.c3Improved, S.cp3.improved);
  o += line(L.c3Compare, S.cp3.compare);
  o += line(T.reflect, S.cp3.reflect) + nl;

  o += T.self + nl + rule;
  var opts = [L.c1Opts, L.c2Opts, L.c3Opts];
  for (i = 0; i < 3; i++) {
    var p = S.self[SELF_KEYS[i]];
    o += line(L.idSkills[i], p ? opts[i][p - 1][0] + " (" + sc[i] + "/3)" : "");
  }
  o += nl;

  o += T.card + nl + rule;
  o += line(T.skill, has("card.skill") ? L.idSkills[Number(S.card.skill)] : "");
  o += line(T.helps, S.card.helps);
  o += line(T.replaces, S.card.replaces);
  o += T.rules + ":" + nl;
  for (var r = 0; r < 3; r++) {
    o += "  " + (r + 1) + ". " + (String(S.card["r" + (r + 1)] || "").trim() || L.rules[r][1]) + nl;
  }
  o += nl + T.fin + nl + rule;
  for (i = 0; i < L.fQs.length; i++) o += line(L.fQs[i], S.fin[FIN_KEYS[i]]);
  o += nl + L.fMantra + nl;
  return o;
}

function copyTranscript() {
  var o = buildTranscript(), L = t();
  var done = function () {
    var m = $("copyMsg");
    if (m) { m.textContent = L.idCopied; m.style.display = "flex"; }
  };
  /* Clipboard API needs a secure context AND clipboard-write permission, which
     a cross-origin Wix iframe may withhold. Always keep a visible escape hatch. */
  var fail = function () { manualCopy(o); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(o).then(done, function () { fallbackCopy(o, done, fail); });
    } else fallbackCopy(o, done, fail);
  } catch (e) { fail(); }
}
function fallbackCopy(text, cb, onFail) {
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  var okd = false;
  try { okd = document.execCommand("copy"); } catch (e) { okd = false; }
  document.body.removeChild(ta);
  okd ? cb() : onFail();
}
/* Last resort: show the text on the page, pre-selected, so the student can
   still press Ctrl+C. Never a dead end. */
function manualCopy(text) {
  var L = t(), host = $("manualWrap");
  if (!host) {
    host = document.createElement("div");
    host.id = "manualWrap";
    host.className = "callout warn";
    host.style.marginTop = "16px";
    host.innerHTML = '<p style="margin:0 0 8px"><b>' + esc(L.copyManual) + "</b></p>" +
      '<textarea id="manualBox" rows="10" style="width:100%;font-family:monospace;font-size:12px"></textarea>';
    $("screen").appendChild(host);
  }
  var box = $("manualBox");
  box.value = text;
  box.focus(); box.select();
  postHeight();
}

/* Wix iframe height (harmless everywhere else) */
function postHeight() {
  try {
    var px = Math.ceil(document.documentElement.scrollHeight) + 24;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "dml:height", px: px }, "*");
    }
  } catch (e) {}
}
window.addEventListener("resize", postHeight);

/* language */
$("langBtn").addEventListener("click", function () {
  S.lang = S.lang === "es" ? "en" : "es";
  save(); render();
});

if (!C[S.lang]) S.lang = "es";
S.step = S.step | 0;
if (S.step < 0 || S.step >= STEPS.length || !canEnter(S.step)) S.step = 0;
wire();
render();
setTimeout(postHeight, 400);
</script>
